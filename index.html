<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Manhwa Library</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>
        <h1>🔥 My Manhwa Library</h1>
        <p>Synchronized between your Phone and PC</p>
    </header>


    <!-- ================= ADD TITLE FORM ================= -->

    <div class="form-container">

        <h3 class="form-title">✨ Add New Title</h3>

        <form id="titleForm">

            <!-- Title -->
            <div class="form-group">
                <label for="titleName">Title Name</label>

                <input type="text" id="titleName" required placeholder="e.g., I'm in Love with the Villainess">
            </div>


            <!-- Image -->
            <div class="form-group">
                <label for="titleImg">
                    Cover Image URL (optional)
                </label>

                <input type="url" id="titleImg" placeholder="Paste image link here">
            </div>


            <!-- Rating + Chapter -->
            <div class="form-group" style="display: flex; gap: 10px;">

                <div style="flex: 1;">

                    <label for="titleRating">
                        My Rating
                    </label>

                    <select id="titleRating">

                        <option value="10/10">
                            ⭐ 10/10 (Masterpiece)
                        </option>

                        <option value="9/10">
                            ⭐ 9/10 (Amazing)
                        </option>

                        <option value="8/10">
                            ⭐ 8/10 (Very Good)
                        </option>

                        <option value="7/10">
                            ⭐ 7/10 (Good)
                        </option>

                        <option value="6/10">
                            ⭐ 6/10 (Fine)
                        </option>

                        <option value="5/10">
                            ⭐ 5/10 (Mediocre)
                        </option>

                        <option value="4/10">
                            ⭐ 4/10 (Bad)
                        </option>

                        <option value="3/10">
                            ⭐ 3/10 (Very Bad)
                        </option>

                        <option value="2/10">
                            ⭐ 2/10 (Horrible)
                        </option>

                        <option value="1/10">
                            ⭐ 1/10 (Appalling)
                        </option>

                    </select>

                </div>


                <div style="flex: 1;">

                    <label for="titleChapter">
                        Current Chapter
                    </label>

                    <input type="number" id="titleChapter" min="0" placeholder="Chapter no." required>

                </div>

            </div>


            <!-- Completed -->
            <div class="checkbox-group">

                <input type="checkbox" id="titleCompleted">

                <label for="titleCompleted">
                    Completely Finished?
                </label>

            </div>


            <!-- Submit -->
            <button type="submit">
                Add to Cloud
            </button>

        </form>

    </div>


    <!-- ================= BOOK GRID ================= -->

    <div class="grid" id="cardsGrid"></div>


    <!-- ================= JAVASCRIPT ================= -->

    <!-- IMPORTANT:
         app.js is loaded AFTER the HTML elements
    -->

    <script src="js/app.js"></script>

</body>

</html>
